name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - v2
    paths:
      - "docs/**"
      # The API reference is rendered from the committed contract, so a spec
      # change has to redeploy the site even when nothing under docs/ moved.
      - "openapi/teldrive.openapi.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Astro bakes absolute URLs into the output, so the site and the base path
      # have to match where Pages actually serves the repository. Deriving them
      # from the run keeps a renamed repository, a fork or a user site
      # deployable without editing the workflow.
      - name: Resolve the Pages origin and base path
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repository_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "DOCS_BASE=/" >> "$GITHUB_ENV"
          else
            echo "DOCS_BASE=/${repository_name}" >> "$GITHUB_ENV"
          fi
          echo "DOCS_SITE=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"

      - name: Build docs
        working-directory: docs
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
