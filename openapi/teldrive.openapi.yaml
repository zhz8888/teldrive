components:
  parameters:
    RefreshCookie:
      name: teldrive_refresh
      in: cookie
      required: true
      description: Cookie value set by a cookie login or a cookie refresh.
      schema:
        type: string
      explode: false
    CursorQuery.cursor:
      name: cursor
      in: query
      required: false
      description: Cursor from the previous page's `nextCursor`; a malformed value is
        rejected with 422.
      schema:
        $ref: "#/components/schemas/Cursor"
      explode: false
    CursorQuery.limit:
      name: limit
      in: query
      required: false
      description: >-
        Requested page size, 1-500; omitted means 100 and the server caps the
        effective

        size, so a full page can be shorter.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
      explode: false
    FileListQuery.scope:
      name: scope
      in: query
      required: false
      description: Region of the drive to list; the wider scopes list active entries only.
      schema:
        allOf:
          - $ref: "#/components/schemas/FileListScope"
        default: folder
      explode: false
    FileListQuery.parentId:
      name: parentId
      in: query
      required: false
      description: Folder to list, or the root of a recursive listing; absent means
        the drive root.
      schema:
        $ref: "#/components/schemas/Uuid"
      explode: false
    FileListQuery.path:
      name: path
      in: query
      required: false
      description: Resolve the listing root relative to the user's drive root.
      schema:
        type: string
        maxLength: 4096
      explode: false
    FileListQuery.kind:
      name: kind
      in: query
      required: false
      description: Keep only files or only folders; absent lists both.
      schema:
        $ref: "#/components/schemas/FileKind"
      explode: false
    FileListQuery.status:
      name: status
      in: query
      required: false
      description: Lifecycle state to list; the drive and recursive scopes accept only
        active.
      schema:
        allOf:
          - $ref: "#/components/schemas/FileStatus"
        default: active
      explode: false
    FileListQuery.search:
      name: search
      in: query
      required: false
      description: File-name search. Text search is case-insensitive; regex uses
        PostgreSQL-compatible regular expressions.
      schema:
        type: string
        maxLength: 512
      explode: false
    FileListQuery.searchType:
      name: searchType
      in: query
      required: false
      description: Match mode of search; it has no effect on a listing without a
        search term.
      schema:
        allOf:
          - $ref: "#/components/schemas/FileSearchType"
        default: text
      explode: false
    FileListQuery.category:
      name: category
      in: query
      required: false
      description: Keep only entries of these derived categories; absent disables the
        filter.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/FileCategory"
      explode: false
    FileListQuery.updatedAfter:
      name: updatedAfter
      in: query
      required: false
      description: Keep entries whose metadata was updated at or after this instant.
      schema:
        type: string
        format: date-time
      explode: false
    FileListQuery.updatedBefore:
      name: updatedBefore
      in: query
      required: false
      description: Keep entries whose metadata was updated strictly before this instant.
      schema:
        type: string
        format: date-time
      explode: false
    FileListQuery.sort:
      name: sort
      in: query
      required: false
      description: Sort key of the listing; a value that is not one of the enum
        members is rejected.
      schema:
        allOf:
          - $ref: "#/components/schemas/FileSort"
        default: name
      explode: false
    FileListQuery.order:
      name: order
      in: query
      required: false
      description: Sort direction; a value that is not one of the enum members is rejected.
      schema:
        allOf:
          - $ref: "#/components/schemas/SortOrder"
        default: asc
      explode: false
    OptionalIfMatchHeader:
      name: If-Match
      in: header
      required: false
      description: >-
        Generation ETag the change is conditional on, for example "7"; a value
        that

        no longer matches the stored generation fails the request with 412, and
        an

        absent header applies the change unconditionally.
      schema:
        $ref: "#/components/schemas/ETag"
    FileContentRequestOptions.range:
      name: Range
      in: header
      required: false
      description: >-
        Byte range to stream in the single "bytes=start-end", "bytes=start-" or

        "bytes=-suffix" form; absent streams the whole file and a range that
        cannot

        be served is rejected with 416.
      schema:
        type: string
    FileContentRequestOptions.ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        Content ETag of an earlier response; a full-file request that still
        matches

        is answered with 304 and no body, while a ranged request ignores it.
      schema:
        $ref: "#/components/schemas/ETag"
    FileContentRequestOptions.download:
      name: download
      in: query
      required: false
      description: Force a browser download instead of inline display.
      schema:
        type: string
        enum:
          - "1"
      explode: false
    UploadPartHeaders.contentLength:
      name: Content-Length
      in: header
      required: true
      description: >-
        Byte length of the plaintext part. It must equal the session's partSize

        except for the final part, the body must yield exactly this many bytes,
        and

        a zero length is rejected as invalid.
      schema:
        type: integer
        format: int64
        minimum: 0
    UploadPartHeaders.checksum:
      name: X-Part-Checksum
      in: header
      required: false
      description: BLAKE3 checksum of the plaintext part.
      schema:
        $ref: "#/components/schemas/Checksum"
    SharePasswordHeader:
      name: X-Share-Password
      in: header
      required: false
      description: Password of the link; omit it for a share that is not password protected.
      schema:
        type: string
    PublicShareListQuery.path:
      name: path
      in: query
      required: false
      description: Folder path relative to the shared folder root.
      schema:
        type: string
        maxLength: 4096
      explode: false
    PublicShareListQuery.search:
      name: search
      in: query
      required: false
      description: >-
        Text matched as a substring or similarity against entry names; omitted
        lists the

        whole folder.
      schema:
        type: string
        maxLength: 512
      explode: false
    JobListQuery.status:
      name: status
      in: query
      required: false
      description: Keep only jobs in this state; absent lists every state.
      schema:
        $ref: "#/components/schemas/JobState"
      explode: false
    JobListQuery.type:
      name: type
      in: query
      required: false
      description: Keep only jobs of this worker kind; absent lists every kind.
      schema:
        type: string
      explode: false
    JobListQuery.queue:
      name: queue
      in: query
      required: false
      description: Keep only jobs of this queue; absent lists every queue.
      schema:
        type: string
      explode: false
    JobPurgeQuery:
      name: status
      in: query
      required: true
      description: Only cancelled, completed and discarded are accepted; any other
        state is rejected with 409.
      schema:
        $ref: "#/components/schemas/JobState"
      explode: false
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: >-
            `ok` when the probe passed; `degraded` when a required dependency
            failed or was

            never configured.
        version:
          type: string
          description: >-
            Build version of the answering process; may be empty when the binary
            carries no

            version information.
      description: >-
        Result of a health probe: the state observed at that moment and the
        version that

        answered.
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        details:
          type: object
          additionalProperties: {}
          description: Optional structured context for the caller.
      description: >-
        One failure: a stable code for clients, a message for humans and
        optional structured

        context.
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          allOf:
            - $ref: "#/components/schemas/ErrorDetail"
          description: Machine-readable error code of the failure.
      description: Payload every failing request returns, whatever the status code.
    Uuid:
      type: string
      format: uuid
      description: Identifier in canonical UUID textual form.
    TelegramLoginStartResponse:
      type: object
      required:
        - flowId
        - expiresAt
        - passwordRequired
      properties:
        flowId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: >-
            Opaque identifier of the flow; pass it back to the verify operations
            while it is

            unexpired.
        expiresAt:
          type: string
          format: date-time
          description: When the flow stops being usable; later verify calls answer 410.
        passwordRequired:
          type: boolean
          description: >-
            True while the account's two-step password is still needed, so the
            client must call

            the verify-password operation.
      description: Pending phone login flow, continued with the verify-code and
        verify-password operations.
    TelegramLoginStartRequest:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: Phone number in E.164 format.
      description: Phone-number login request; the server asks Telegram to send a
        login code to that number.
    TelegramQRLoginState:
      type: string
      enum:
        - pending
        - password_required
      description: Input that a QR login flow is still waiting for.
    TelegramQRLoginResponse:
      type: object
      required:
        - flowId
        - expiresAt
        - state
      properties:
        flowId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Opaque identifier of the flow; pass it back to the poll operations.
        expiresAt:
          type: string
          format: date-time
          description: When the flow stops being usable; polling after this instant
            answers 410.
        state:
          allOf:
            - $ref: "#/components/schemas/TelegramQRLoginState"
          description: Which input the flow still needs.
        qrUrl:
          type: string
          description: "`tg://` link to render as a QR code; omitted once the password
            prompt was reached."
        qrExpiresAt:
          type: string
          format: date-time
          description: >-
            When Telegram stops accepting the QR token, after which a poll
            returns a fresh

            link; omitted at the password prompt.
      description: Current challenge of a QR login flow, repeated on every poll that
        has not completed.
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: "Signed bearer token to send as `Authorization: Bearer` on API
            requests."
        refreshToken:
          type: string
          description: >-
            Opaque secret that obtains the next pair; it is rotated on every
            refresh, so the

            value just used becomes invalid.
        tokenType:
          type: string
          enum:
            - Bearer
          description: Always `Bearer`.
        expiresIn:
          type: integer
          format: int32
          description: Access token lifetime in seconds.
      description: Credential pair issued by a completed login or a token refresh.
    TelegramQRLoginPollRequest:
      type: object
      required:
        - flowId
      properties:
        flowId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Identifier returned by the QR start operation.
      description: Poll request naming the QR flow to advance.
    TelegramCodeVerifyRequest:
      type: object
      required:
        - flowId
        - code
      properties:
        flowId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Identifier returned by a start operation; it must still be unexpired.
        code:
          type: string
          minLength: 1
          maxLength: 16
          description: Code Telegram sent to the phone, 1 to 16 characters.
      description: Login code that Telegram sent to the phone, submitted for a pending flow.
    TelegramPasswordVerifyRequest:
      type: object
      required:
        - flowId
        - password
      properties:
        flowId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Identifier of the flow that asked for the password.
        password:
          type: string
          minLength: 1
          description: The account's Telegram two-step password.
      description: Two-step password submitted for a flow that reported `passwordRequired`.
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: >-
            Refresh token from a previous login or refresh; it is rotated, so
            the value sent

            stops working.
      description: |-
        Token refresh request; the refresh token is itself the credential, so no
        Authorization header is needed.
    CookieSession:
      type: object
      required:
        - authenticated
        - expiresAt
      properties:
        authenticated:
          type: boolean
          enum:
            - true
          description: "Always true: the model is only returned once a session was
            established."
        expiresAt:
          type: string
          format: date-time
          description: When the refresh session expires; the access cookie is renewed
            silently before then.
      description: >-
        Session state returned by a browser cookie login; the tokens themselves
        stay in

        HttpOnly cookies.
    UserRole:
      type: string
      enum:
        - owner
        - admin
        - user
      description: Account role, in descending privilege.
    UserProfile:
      type: object
      required:
        - userId
        - premium
        - role
        - capabilities
        - createdAt
      properties:
        userId:
          type: integer
          format: int64
          description: Telegram user ID of the account.
        displayName:
          type: string
          description: Display name; omitted when unset.
        username:
          type: string
          description: Telegram
        premium:
          type: boolean
          description: Whether the Telegram account has a premium subscription.
        role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: Current role of the account.
        capabilities:
          type: array
          items:
            type: string
          description: >-
            Permission strings derived from the role, for example `files.write`
            or

            `system.manageUsers`; clients use them to show or hide controls.
        createdAt:
          type: string
          format: date-time
          description: When the account first signed in to this deployment.
      description: Profile of the authenticated account.
    ETag:
      type: string
      description: >-
        Strong entity tag of a resource: a quoted generation number, or a quoted
        content hash

        on download responses.
    UserSearchResult:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          format: int64
          description: Telegram user ID; pass it as `granteeUserId` when granting access.
        displayName:
          type: string
          description: Display name; omitted when unset.
        username:
          type: string
          description: Telegram
      description: Lightweight account identity returned by user search.
    AdminUserSummary:
      type: object
      required:
        - userId
        - premium
        - role
        - disabled
        - createdAt
        - updatedAt
      properties:
        userId:
          type: integer
          format: int64
          description: Telegram user ID of the account.
        displayName:
          type: string
          description: Telegram display name; omitted when Telegram reports none.
        username:
          type: string
          description: Telegram
        premium:
          type: boolean
          description: Whether the Telegram account has a premium subscription.
        role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: Current role of the account.
        disabled:
          type: boolean
          description: Whether the account is disabled and therefore refuses to
            authenticate.
        createdAt:
          type: string
          format: date-time
          description: When the account first signed in to this deployment.
        updatedAt:
          type: string
          format: date-time
          description: When the account row was last changed.
      description: Account row as shown in the admin console.
    UserAdminUpdateRequest:
      type: object
      properties:
        role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: >-
            New role; only `admin` and `user` are accepted, so no account can be
            promoted to

            owner here.
        disabled:
          type: boolean
          description: True disables the account and revokes its sessions and API keys;
            false re-enables it.
      description: >-
        Administrative patch of one account; at least one field must be present
        or the

        request is rejected with 422.
    Cursor:
      type: string
      description: >-
        Opaque pagination cursor returned as `nextCursor`; clients pass it back
        unchanged and

        never parse it.
    ApiKeySummary:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Key identifier used to revoke it.
        name:
          type: string
          description: Label given at creation.
        createdAt:
          type: string
          format: date-time
          description: When the key was created.
        lastUsedAt:
          type: string
          format: date-time
          description: When the key last authenticated a request; omitted while it has
            never been used.
        expiresAt:
          type: string
          format: date-time
          description: When the key stops authenticating; a key past its expiry is never
            listed.
        revokedAt:
          type: string
          format: date-time
          description: When the key was revoked; revoked keys are not listed, so this is
            normally absent.
      description: One API key of the account, without its secret.
    ApiKeyCreated:
      type: object
      required:
        - id
        - name
        - secret
        - createdAt
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Key identifier used to revoke it.
        name:
          type: string
          description: Label given at creation.
        secret:
          type: string
          description: Returned once. The server stores only a hash.
        createdAt:
          type: string
          format: date-time
          description: When the key was created.
        expiresAt:
          type: string
          format: date-time
          description: Expiry given at creation; omitted when the key never expires.
      description: Newly minted API key; its plaintext secret is returned only in this
        response.
    ApiKeyCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Label shown in key listings, 1 to 120 characters.
        expiresAt:
          type: string
          format: date-time
          description: When the key stops authenticating; omitted means it never expires.
      description: Request to mint an API key for the authenticated account.
    SessionSummary:
      type: object
      required:
        - id
        - current
        - createdAt
        - expiresAt
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Session identifier used to revoke it.
        current:
          type: boolean
          description: True for the session backing the credential that made this request.
        createdAt:
          type: string
          format: date-time
          description: When the session was created.
        lastUsedAt:
          type: string
          format: date-time
          description: When the session last authenticated a request; omitted while it has
            not been used yet.
        expiresAt:
          type: string
          format: date-time
          description: When the session stops being usable.
        revokedAt:
          type: string
          format: date-time
          description: >-
            When the session was revoked; the listing only returns live
            sessions, so this is

            normally absent.
      description: One TelDrive login session of the account.
    ChannelHealth:
      type: string
      enum:
        - unknown
        - healthy
        - degraded
        - unavailable
      description: Last recorded health of a channel; `unavailable` keeps the channel
        out of uploads.
    ChannelSummary:
      type: object
      required:
        - id
        - name
        - selected
        - health
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Telegram channel ID.
        name:
          type: string
          description: Channel title.
        selected:
          type: boolean
          description: True for the channel new uploads currently target; at most one
            channel per account.
        health:
          allOf:
            - $ref: "#/components/schemas/ChannelHealth"
          description: Last recorded health of this channel.
        createdAt:
          type: string
          format: date-time
          description: When the channel was registered with TelDrive.
      description: One Telegram channel registered to the account.
    DiscoveredChannel:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Telegram channel ID.
        name:
          type: string
          description: Channel title reported by Telegram.
      description: A channel Telegram reports the account can manage, registered with
        TelDrive or not.
    ChannelCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          description: Optional display name. Telegram may choose the final title.
        selected:
          type: boolean
          description: >-
            Whether to make the new channel the upload target; omitted or false
            leaves the

            current selection unchanged.
          default: true
      description: Request to create a new Telegram channel and register it.
    BotSummary:
      type: object
      required:
        - id
        - enabled
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Telegram bot user ID parsed from the token.
        username:
          type: string
          description: Bot
        enabled:
          type: boolean
          description: >-
            True once provisioning verified the token with Telegram; a pending
            or failed bot is

            false and cannot be used for uploads.
        createdAt:
          type: string
          format: date-time
          description: When the token was registered with TelDrive.
      description: One registered Telegram bot.
    BotCreateResponse:
      type: object
      required:
        - bots
        - failedIndexes
      properties:
        bots:
          type: array
          items:
            $ref: "#/components/schemas/BotSummary"
          description: Bots stored by this request, in the order their tokens were accepted.
        failedIndexes:
          type: array
          items:
            type: integer
            format: int32
          description: >-
            Zero-based indexes into the request's `tokens` that were rejected as
            malformed or

            duplicated.
        jobId:
          type: string
          description: Present only when existing channels need background bot provisioning.
      description: Result of registering a batch of bot tokens.
    BotCreateRequest:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 200
          description: Telegram bot tokens. Tokens are never returned by the API.
      description: Request to register Telegram bots by token.
    EventStreamTicket:
      type: object
      required:
        - ticket
        - expiresAt
      properties:
        ticket:
          type: string
          description: Short-lived credential suitable for a browser EventSource URL.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the ticket stops authenticating; it is bound to the issuing
            account and its

            default lifetime is two minutes.
      description: Credential that lets an EventSource URL authenticate without headers.
    FileListScope:
      type: string
      enum:
        - folder
        - drive
        - recursive
      description: Region of the drive a listing covers.
    FileKind:
      type: string
      enum:
        - file
        - folder
      description: Whether a catalog entry holds content or groups other entries.
    FileStatus:
      type: string
      enum:
        - active
        - trashed
        - deletion_pending
      description: >-
        Lifecycle of a catalog entry. Trashing only flips the status and keeps
        the

        content parts; the purge sweep later deletes the parts of a
        deletion-pending

        entry.
    FileSearchType:
      type: string
      enum:
        - text
        - regex
      description: How the search term is matched against entry names.
    FileCategory:
      type: string
      enum:
        - archive
        - audio
        - document
        - image
        - video
        - other
      description: Bucket the server derives from an entry's MIME type, falling back
        to the file name.
    FileSort:
      type: string
      enum:
        - name
        - updatedAt
        - size
        - id
      description: Key a listing is ordered by; a cursor only continues a listing
        produced with the same key and order.
    SortOrder:
      type: string
      enum:
        - asc
        - desc
      description: Direction a sorted listing is returned in.
    HashAlgorithm:
      type: string
      enum:
        - blake3
      description: Content-digest algorithms the contract accepts; only BLAKE3 is
        advertised today.
    Checksum:
      type: string
      description: BLAKE3 digest of plaintext content, 64 lowercase hex characters.
    FileHash:
      type: object
      required:
        - algorithm
        - value
      properties:
        algorithm:
          allOf:
            - $ref: "#/components/schemas/HashAlgorithm"
          description: Algorithm that produced `value`.
        value:
          allOf:
            - $ref: "#/components/schemas/Checksum"
          description: Digest of the plaintext content in that algorithm's encoding.
      description: Content digest of a file or upload, used to verify transfers.
    FileEntry:
      type: object
      required:
        - id
        - name
        - kind
        - encryption
        - status
        - modTime
        - generation
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Entry UUID; this is the fileId path parameter of the single-entry
            endpoints.
        parentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Containing folder; absent for an entry sitting in the drive root.
        name:
          type: string
          description: Entry name, unique among the active entries of the same parent and
            never blank.
        kind:
          allOf:
            - $ref: "#/components/schemas/FileKind"
          description: Whether this entry is a file or a folder.
        mimeType:
          type: string
          description: Media type recorded at upload time; absent when the upload supplied
            none.
        size:
          type: integer
          format: int64
          description: Content size in bytes; absent for folders, which never carry a size.
        hash:
          allOf:
            - $ref: "#/components/schemas/FileHash"
          description: Content checksum (BLAKE3 tree hash) recorded on completion; absent
            when no part hash was stored.
        encryption:
          type: boolean
          description: Whether the content parts are stored encrypted and decrypted by the
            server on read.
        status:
          allOf:
            - $ref: "#/components/schemas/FileStatus"
          description: Lifecycle state of the entry.
        modTime:
          type: string
          format: date-time
          description: Modification time of the content, as supplied when the entry was
            created or last updated.
        generation:
          type: integer
          format: int64
          description: Revision of the metadata; it is incremented by every rename, move,
            trash and restore.
        createdAt:
          type: string
          format: date-time
          description: Time the entry row was created.
        updatedAt:
          type: string
          format: date-time
          description: Time the entry row was last changed.
        parentPath:
          type: string
          description: Location path, included for drive and recursive listings.
      description: One catalog entry with its metadata, as returned by every file endpoint.
    FileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New name, 1 to 255 characters and not blank; absent keeps the
            current name.
        modTime:
          type: string
          format: date-time
          description: New modification time; absent keeps the current one.
      description: Partial metadata change of one entry; at least one of name and
        modTime must be set.
    NameConflictPolicy:
      type: string
      enum:
        - fail
        - replace
        - rename
      description: What a move, copy or create does when an entry of that name already
        exists at the destination.
    FileMoveRequest:
      type: object
      properties:
        parentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Destination folder; absent moves the entry to the caller's drive
            root.
        conflictPolicy:
          allOf:
            - $ref: "#/components/schemas/NameConflictPolicy"
          description: How to resolve a name already taken at the destination.
          default: fail
      description: Destination of a single-entry move within one owner's drive.
    Uri:
      type: string
      format: uri
      description: URI in RFC 3986 form, percent-encoded.
    FileCopyRequest:
      type: object
      properties:
        parentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Destination folder; absent copies into the source owner's drive root.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the copied root, 1 to 255 characters; absent keeps the
            source name.
        conflictPolicy:
          allOf:
            - $ref: "#/components/schemas/NameConflictPolicy"
          description: How to resolve a name already taken at the destination.
          default: fail
      description: Destination and naming of a copy.
    ViewerKind:
      type: string
      enum:
        - image
        - video
        - audio
        - pdf
        - ebook
        - text
      description: Viewer a saved reader state belongs to.
    FileViewState:
      type: object
      required:
        - fileId
        - kind
        - position
        - preferences
        - bookmarks
        - updatedAt
      properties:
        fileId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: File the state belongs to.
        kind:
          allOf:
            - $ref: "#/components/schemas/ViewerKind"
          description: Viewer the state was saved by.
        position:
          type: object
          additionalProperties: {}
          description: Opaque JSON object, for example the reading or playback position.
        preferences:
          type: object
          additionalProperties: {}
          description: Opaque JSON object with the viewer settings chosen by the user.
        bookmarks:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Reader bookmarks, each an opaque JSON value; at most 500 entries.
        updatedAt:
          type: string
          format: date-time
          description: Time the state was last written.
      description: Reader state one user saved for one file; the server treats every
        payload as opaque JSON.
    FileViewStateUpdate:
      type: object
      required:
        - kind
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/ViewerKind"
          description: Viewer the state is saved by.
        position:
          type: object
          additionalProperties: {}
          description: Opaque JSON object; omitted stores an empty object.
        preferences:
          type: object
          additionalProperties: {}
          description: Opaque JSON object; omitted stores an empty object.
        bookmarks:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 500
          description: Reader bookmarks; omitted stores an empty list, and more than 500
            entries are rejected.
      description: >-
        Reader state to store for one file. The write replaces the whole stored
        state:

        an omitted position, preferences or bookmarks is stored as an empty
        object or

        list rather than merged with the previous value.
    FileBulkResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
          description: Moved entries in request order, or every trashed entry including
            the descendants of the roots.
      description: Entries a bulk operation affected.
    FileBulkMoveRequest:
      type: object
      required:
        - fileIds
      properties:
        fileIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          minItems: 1
          maxItems: 500
          description: Entries to move, 1 to 500 IDs; every entry must belong to the
            destination's owner.
        parentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Destination folder; absent moves the entries to the caller's own
            drive root.
        conflictPolicy:
          allOf:
            - $ref: "#/components/schemas/NameConflictPolicy"
          description: How to resolve a name already taken at the destination; the default
            fails the whole batch.
          default: fail
      description: Batch move request; the whole batch is applied in a single transaction.
    FileBulkTrashRequest:
      type: object
      required:
        - fileIds
      properties:
        fileIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          minItems: 1
          maxItems: 500
          description: Entries to trash, 1 to 500 IDs; the root of a share the caller does
            not own cannot be trashed.
      description: Batch trash request; the whole batch is applied in a single transaction.
    FileCategoryStatistics:
      type: object
      required:
        - category
        - totalFiles
        - totalSize
      properties:
        category:
          allOf:
            - $ref: "#/components/schemas/FileCategory"
          description: Bucket the counted files fall into.
        totalFiles:
          type: integer
          format: int64
          description: Number of active files in the bucket; folders are never counted.
        totalSize:
          type: integer
          format: int64
          description: Summed size of those files in bytes.
      description: File count and bytes of one category bucket of a drive.
    DriveStatistics:
      type: object
      required:
        - totalFiles
        - totalFolders
        - totalBytes
        - trashedFiles
        - activeShares
        - openUploads
      properties:
        totalFiles:
          type: integer
          format: int64
          description: Number of active files.
        totalFolders:
          type: integer
          format: int64
          description: Number of active folders.
        totalBytes:
          type: integer
          format: int64
          description: Summed size of the active files in bytes.
        trashedFiles:
          type: integer
          format: int64
          description: Number of trashed files; trashed folders are not counted.
        activeShares:
          type: integer
          format: int64
          description: Shares that are neither revoked nor expired.
        openUploads:
          type: integer
          format: int64
          description: Upload sessions still open or completing.
      description: Aggregate counters of one user's drive.
    FolderCreateRequest:
      type: object
      required:
        - name
      properties:
        parentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Parent folder; absent creates the folder in the caller's drive root.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Folder name, 1 to 255 characters and not blank.
        conflictPolicy:
          allOf:
            - $ref: "#/components/schemas/NameConflictPolicy"
          description: Only fail is accepted here; replace and rename are rejected as
            invalid input.
          default: fail
        modTime:
          type: string
          format: date-time
          description: Modification time to record; absent records the current time.
      description: Body of a folder creation request.
    UploadState:
      type: string
      enum:
        - open
        - completing
        - completed
        - aborted
        - expired
      description: >-
        Lifecycle of an upload session. A session is created open and only an
        open

        session accepts parts; completion publishes the file and moves the
        session

        through completing to completed inside one transaction, while abort and
        the

        expiry sweep retire it as aborted or expired.
    UploadSession:
      type: object
      required:
        - id
        - name
        - expectedSize
        - modTime
        - encryption
        - conflictPolicy
        - partSize
        - state
        - expiresAt
        - createdAt
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Session UUID; the uploadId path parameter of the session endpoints.
        parentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Destination folder; absent means the drive root.
        name:
          type: string
          description: Destination file name; a rename-policy completion replaces it with
            a free " (n)" variant.
        expectedSize:
          type: integer
          format: int64
          description: Total plaintext size in bytes, or -1 while unknown; completion then
            derives it from the stored parts.
        expectedHash:
          allOf:
            - $ref: "#/components/schemas/FileHash"
          description: Expected whole-file tree hash, compared at completion; absent skips
            that comparison.
        mimeType:
          type: string
          description: Media type recorded at creation; absent when the request carried
            none.
        modTime:
          type: string
          format: date-time
          description: Modification time recorded on the published file.
        encryption:
          type: boolean
          description: Whether the parts are stored encrypted and decrypted by the server
            on read.
        conflictPolicy:
          allOf:
            - $ref: "#/components/schemas/NameConflictPolicy"
          description: Policy completion applies to an occupied destination name (fail,
            replace or rename).
        partSize:
          type: integer
          format: int64
          description: Plaintext size in bytes every part but the last must have; the last
            part holds the remainder.
        state:
          allOf:
            - $ref: "#/components/schemas/UploadState"
          description: Lifecycle state of the session; see UploadState.
        expiresAt:
          type: string
          format: date-time
          description: >-
            Deadline for claiming parts and completing, fixed at creation (the
            server's

            session TTL, 7 days by default). A past deadline makes part writes
            and

            completion fail with 410 while the session is still open; the expiry
            sweep

            then moves it to expired.
        createdAt:
          type: string
          format: date-time
          description: Time the session was created.
        completedAt:
          type: string
          format: date-time
          description: Time completion published the file; absent until the session
            reaches completed.
        fileId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: The published file; absent until the session reaches completed.
      description: >-
        Durable upload session. It outlives the connection that created it:
        parts are

        held in PostgreSQL and Telegram, so a client resumes by listing the
        parts it

        already stored and continues from the first missing one.
    UploadDailyStatistics:
      type: object
      required:
        - date
        - uploadedBytes
        - completedFiles
      properties:
        date:
          type: string
          format: date
          description: Day the totals cover, at midnight UTC.
        uploadedBytes:
          type: integer
          format: int64
          description: Summed plaintext bytes of the sessions completed that day.
        completedFiles:
          type: integer
          format: int64
          description: Number of sessions completed that day.
      description: |-
        One UTC day of completed upload activity; days without a completion are
        reported as zero rows instead of being omitted.
    JobState:
      type: string
      enum:
        - available
        - cancelled
        - completed
        - discarded
        - pending
        - retryable
        - running
        - scheduled
      description: >-
        Lifecycle state of a River job. A job becomes available or scheduled,
        turns

        running while a worker holds it, and ends in completed, cancelled or

        discarded.
    JobAttemptError:
      type: object
      required:
        - attempt
        - at
        - error
      properties:
        attempt:
          type: integer
          format: int32
          description: 1-based number of the attempt that failed.
        at:
          type: string
          format: date-time
          description: Time the attempt failed.
        error:
          type: string
          description: Error message reported by the worker.
        trace:
          type: string
          description: Stack trace captured for the attempt; absent when River stored none.
      description: One failed attempt of a job, as recorded by River.
    Job:
      type: object
      required:
        - id
        - status
        - type
        - queue
        - attempt
        - maxAttempts
        - priority
        - tags
        - args
        - errors
        - attemptedBy
        - createdAt
        - scheduledAt
      properties:
        id:
          type: string
          description: River job ID, unique across all kinds and queues.
        status:
          allOf:
            - $ref: "#/components/schemas/JobState"
          description: Lifecycle state of the job.
        type:
          type: string
          description: Worker kind that executes the job, for example
            "teldrive_cleanup_uploads".
        parentId:
          type: string
          description: Identifier of the job this one is grouped under; absent unless the
            producer set one.
        queue:
          type: string
          description: Queue the job was inserted into.
        description:
          type: string
          description: Human-readable description taken from the job metadata; absent when
            none is set.
        message:
          type: string
          description: Message taken from the job metadata, falling back to the most
            recent attempt error.
        attempt:
          type: integer
          format: int32
          description: Number of attempts already made, including the current one.
        maxAttempts:
          type: integer
          format: int32
          description: Attempt budget; the job is discarded once it is exhausted.
        priority:
          type: integer
          format: int32
          description: River priority, 1 being the highest and 4 the lowest.
        tags:
          type: array
          items:
            type: string
          description: Operator-supplied labels attached to the job.
        args:
          type: object
          additionalProperties: {}
          description: Job arguments keyed by JSON field name; credential-like values are
            redacted.
        output:
          type: object
          additionalProperties: {}
          description: JSON object the worker recorded on success; absent when it recorded
            none.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/JobAttemptError"
          description: Failed attempts in chronological order.
        attemptedBy:
          type: array
          items:
            type: string
          description: Worker clients that picked the job up.
        createdAt:
          type: string
          format: date-time
          description: Time the job was inserted.
        scheduledAt:
          type: string
          format: date-time
          description: Time the job became or becomes eligible to run.
        startedAt:
          type: string
          format: date-time
          description: Time the current or last attempt started; absent while the job has
            never been attempted.
        completedAt:
          type: string
          format: date-time
          description: Time the job reached a terminal state; absent while it is still
            active.
      description: A River job as the management API exposes it; the values are a
        snapshot and may already be stale.
    UploadImportSourceType:
      type: string
      enum:
        - local
        - http
      description: Kind of source a background import reads from, which decides the
        required field.
    UploadImportSource:
      type: object
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: "#/components/schemas/UploadImportSourceType"
          description: Source kind; selects whether path or url is used.
        path:
          type: string
          description: Absolute path of a file, or of a directory walked recursively;
            required for a local source.
        url:
          type: string
          format: uri
          description: http or https URL of a single file; required for an http source.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Extra request headers for this URL, merged over the batch headers
            with these winning.
        destinationPath:
          type: string
          description: Slash-separated path to store the file at inside the destination,
            overriding its derived name.
        exclude:
          type: array
          items:
            type: string
          description: Globs that skip matching files of this source, relative to the
            source or its URL.
      description: >-
        One import source. The type decides whether path or url is required, and
        the

        remaining fields narrow what the source expands to.
    UploadImportRequest:
      type: object
      required:
        - destination
        - sources
      properties:
        destination:
          type: string
          description: Destination folder UUID or absolute drive path from root.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/UploadImportSource"
          description: Sources to import; at least one is required.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Default request headers for every remote source, overridden per
            source.
        exclude:
          type: array
          items:
            type: string
          description: Globs that skip files of every source, applied on top of the
            per-source patterns.
        minSize:
          type: string
          description: Smallest file size to import, inclusive, written as a
            human-readable size such as "10MiB".
        maxSize:
          type: string
          description: Largest file size to import, inclusive and written like minSize; a
            smaller maxSize fails the job.
        partConcurrency:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
          description: Parts of one file transferred at once; a value above 16 is rejected.
          default: 4
        chunkSize:
          type: integer
          format: int64
          minimum: 67108864
          maximum: 2097152000
          description: Preferred upload part size. Values are aligned to the nearest 16 MiB.
          default: 536870912
        encryption:
          type: boolean
          description: Store the imported files encrypted under the active key; requires a
            configured key version.
          default: false
      description: >-
        Server-side batch import: the request is queued as a background job, so
        the

        response is the job, not the imported files.
    UploadCreateRequest:
      type: object
      required:
        - name
        - size
        - modTime
      properties:
        parentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Destination folder; absent uploads into the caller's own drive root.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Destination file name, 1 to 255 characters and not blank; stored
            verbatim.
        size:
          type: integer
          format: int64
          minimum: -1
          description: Expected size in bytes, or -1 when the size is unknown until
            completion.
        mimeType:
          type: string
          description: Media type to record on the published file; absent leaves the entry
            without one.
        modTime:
          type: string
          format: date-time
          description: Modification time to record on the published file; the zero instant
            means the current time.
        hash:
          allOf:
            - $ref: "#/components/schemas/FileHash"
          description: Expected whole-file BLAKE3 tree hash, compared at completion;
            absent skips the comparison.
        encryption:
          type: boolean
          description: Store the content encrypted under the caller's key; rejected when
            the deployment has no active key.
          default: false
        conflictPolicy:
          allOf:
            - $ref: "#/components/schemas/NameConflictPolicy"
          description: >-
            How completion resolves an occupied destination name: fail, replace
            or

            rename; anything else is rejected, and replace overwrites only a
            regular file.
          default: fail
        preferredPartSize:
          type: integer
          format: int64
          minimum: 1048576
          description: Optional preferred part size. The server may choose a different
            value.
      description: >-
        Request that opens a durable upload session. The destination name is not

        reserved here: a clash with an existing entry is resolved when the
        session is

        completed, following the requested conflict policy.
    UploadPartState:
      type: string
      enum:
        - reserved
        - uploading
        - stored
        - failed
      description: >-
        Lifecycle of one part. A part is claimed under a lease as uploading,
        becomes

        stored once its bytes are readable, or failed when the attempt was
        abandoned;

        a stored or failed part can be claimed again under a new lease.
    UploadPart:
      type: object
      required:
        - uploadId
        - partNo
        - state
        - plainSize
        - createdAt
        - updatedAt
      properties:
        uploadId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Session the part belongs to.
        partNo:
          type: integer
          format: int32
          description: 1-based part number; the stored parts of a session tile the file
            from 1 without gaps.
        state:
          allOf:
            - $ref: "#/components/schemas/UploadPartState"
          description: Lease and write state of this part; see UploadPartState.
        plainSize:
          type: integer
          format: int64
          description: Plaintext bytes this part covers, as declared when it was claimed.
        storedSize:
          type: integer
          format: int64
          description: Bytes the part occupies in storage, larger than plainSize once
            encrypted; absent until stored.
        checksum:
          allOf:
            - $ref: "#/components/schemas/Checksum"
          description: >-
            BLAKE3 tree hash of the part plaintext in lowercase hex; absent
            until the

            part is stored, and for a part stored without hashing.
        createdAt:
          type: string
          format: date-time
          description: Time the part was first claimed.
        updatedAt:
          type: string
          format: date-time
          description: Time the part row last changed, through claim, lease renewal, store
            or failure.
      description: >-
        One part of an upload session: a fixed slice of the plaintext, written
        under a

        lease so a stalled writer cannot overwrite a newer attempt, and copied
        into the

        published file's parts on completion.
    SharePermission:
      type: string
      enum:
        - read
        - edit
      description: Access level a share or grant confers.
    ShareCreated:
      type: object
      required:
        - id
        - fileId
        - token
        - publicUrl
        - passwordProtected
        - permission
        - createdAt
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Share identifier used to update or revoke the link.
        fileId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: File or folder the link exposes.
        token:
          type: string
          description: Opaque public token returned only when the share is created.
        publicUrl:
          allOf:
            - $ref: "#/components/schemas/Uri"
          description: >-
            Path of the link on the deployment host, `/share/<token>`; resolve
            it against the

            origin to build a URL.
        passwordProtected:
          type: boolean
          description: True when the link asks for a password.
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working; omitted when it never expires.
        maxDownloads:
          type: integer
          format: int64
          description: Download limit; omitted when unlimited.
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Access level the link confers.
        createdAt:
          type: string
          format: date-time
          description: When the link was created.
      description: A freshly created share, including the token that is returned only here.
    ShareCreateRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          description: Optional password. The server stores only a password hash.
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working; must be in the future, and omitted
            means it never expires.
        maxDownloads:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Downloads allowed before the link is exhausted; must be positive,
            and omitted means

            unlimited.
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Access level of the link; omitted means `read`.
          default: read
      description: Request to mint a public share link for one file or folder the
        caller owns.
    ShareSummary:
      type: object
      required:
        - id
        - fileId
        - passwordProtected
        - downloadCount
        - permission
        - createdAt
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Share identifier used to update or revoke the link.
        fileId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: File or folder the link exposes.
        passwordProtected:
          type: boolean
          description: True when the link asks for a password.
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working; omitted when it never expires.
        maxDownloads:
          type: integer
          format: int64
          description: Download limit; omitted when unlimited.
        downloadCount:
          type: integer
          format: int64
          description: Downloads already charged against the link.
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Access level the link confers.
        createdAt:
          type: string
          format: date-time
          description: When the link was created.
        revokedAt:
          type: string
          format: date-time
          description: When the link was revoked; revoked shares stay listed with their
            state.
      description: One share of a file, without its token.
    ShareUpdateRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          description: Replacement password; must not be combined with `clearPassword`.
        clearPassword:
          type: boolean
          description: >-
            True removes the password so the link becomes public; must not be
            combined with

            `password`.
          default: false
        expiresAt:
          type: string
          format: date-time
          description: >-
            Replacement expiry; must be in the future and must not be combined
            with

            `clearExpiresAt`.
        clearExpiresAt:
          type: boolean
          description: >-
            True removes the expiry so the link no longer ages out; must not be
            combined with

            `expiresAt`.
          default: false
        maxDownloads:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Replacement download limit, which cannot be set below the downloads
            already

            counted; must not be combined with `clearMaxDownloads`.
        clearMaxDownloads:
          type: boolean
          description: True removes the download limit; must not be combined with
            `maxDownloads`.
          default: false
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Replacement access level.
      description: >-
        Partial update of a share; omitted fields keep their value, the `clear*`
        flags remove

        one, and a request that sets nothing is rejected.
    FileAccessGrantSummary:
      type: object
      required:
        - id
        - fileId
        - ownerId
        - granteeUserId
        - permission
        - createdAt
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Grant identifier used to update or revoke it.
        fileId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: File the grant applies to.
        ownerId:
          type: integer
          format: int64
          description: Account that owns the file.
        granteeUserId:
          type: integer
          format: int64
          description: Telegram user ID of the account that received access.
        granteeDisplayName:
          type: string
          description: Grantee display name; omitted when unset.
        granteeUsername:
          type: string
          description: Grantee
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Access level the grant confers.
        expiresAt:
          type: string
          format: date-time
          description: When the grant stops applying; omitted when it never expires.
        createdAt:
          type: string
          format: date-time
          description: When the grant was created.
      description: One access grant on a file, including the grantee identity.
    FileAccessGrantCreateRequest:
      type: object
      required:
        - granteeUserId
      properties:
        granteeUserId:
          type: integer
          format: int64
          description: >-
            Telegram user ID of the account to grant; it must exist, be enabled
            and differ from

            the caller.
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Access level to grant; omitted means `read`.
          default: read
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the grant stops applying; must be in the future, and omitted
            means it never

            expires.
      description: Request to grant another account access to one of the caller's files.
    FileAccessGrantUpdateRequest:
      type: object
      properties:
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Replacement access level.
        expiresAt:
          type: string
          format: date-time
          description: >-
            Replacement expiry, which must be in the future and must not be
            combined with

            `clearExpiresAt`.
        clearExpiresAt:
          type: boolean
          description: True removes the expiry so the grant no longer ages out.
          default: false
      description: >-
        Partial update of a grant; at least one field must be present or the
        request is

        rejected with 422.
    SharedWithMeEntry:
      type: object
      required:
        - file
        - permission
      properties:
        file:
          allOf:
            - $ref: "#/components/schemas/FileEntry"
          description: The granted file.
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Access level the caller holds on it.
      description: A file another owner granted the caller, with the level granted.
    PublicShare:
      type: object
      required:
        - id
        - file
        - passwordProtected
        - permission
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Share identifier.
        file:
          allOf:
            - $ref: "#/components/schemas/FileEntry"
          description: The shared file, or the folder acting as the share root.
        passwordProtected:
          type: boolean
          description: True when the link requires the `X-Share-Password` header.
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working; omitted when it never expires.
        permission:
          allOf:
            - $ref: "#/components/schemas/SharePermission"
          description: Access level the link confers.
      description: Public view of a share, returned to whoever holds its token.
    JobPageMeta:
      type: object
      properties:
        nextCursor:
          allOf:
            - $ref: "#/components/schemas/Cursor"
          description: Opaque cursor for the next page; absent when this was the last page.
      description: Paging metadata of a job listing.
    JobPage:
      type: object
      required:
        - tasks
        - meta
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Job"
          description: Jobs of the page, newest first.
        meta:
          allOf:
            - $ref: "#/components/schemas/JobPageMeta"
          description: Cursor for the following page.
      description: One page of jobs.
    JobCreate:
      type: object
      required:
        - type
        - args
      properties:
        type:
          type: string
          description: >-
            Worker kind to run: one of the cleanup sweeps this deployment
            registered a

            worker for ("teldrive_cleanup_uploads",
            "teldrive_cleanup_user_events",

            "teldrive_cleanup_trash", "teldrive_purge_pending_files" or

            "teldrive_cleanup_orphaned_telegram_parts"). Any other kind is
            rejected with

            422.
        args:
          type: object
          additionalProperties: {}
          description: Job arguments keyed by JSON field name; the worker applies its own
            defaults to absent fields.
        queue:
          type: string
          description: Target queue; absent selects River's default queue.
        priority:
          type: integer
          format: int32
          description: River priority from 1 (highest) to 4 (lowest); absent or not
            positive selects the default.
        maxAttempts:
          type: integer
          format: int32
          description: Attempt budget; absent or not positive selects River's default.
        tags:
          type: array
          items:
            type: string
          description: Labels attached to the job.
      description: A one-off maintenance job to enqueue.
    JobStatistics:
      type: object
      required:
        - available
        - cancelled
        - completed
        - discarded
        - pending
        - retryable
        - running
        - scheduled
      properties:
        available:
          type: integer
          format: int64
          description: Jobs queued and ready to be worked.
        cancelled:
          type: integer
          format: int64
          description: Jobs cancelled before they could finish.
        completed:
          type: integer
          format: int64
          description: Jobs that finished successfully.
        discarded:
          type: integer
          format: int64
          description: Jobs that exhausted their attempts.
        pending:
          type: integer
          format: int64
          description: Jobs waiting on an external dependency.
        retryable:
          type: integer
          format: int64
          description: Failed jobs waiting for another attempt.
        running:
          type: integer
          format: int64
          description: Jobs currently being worked.
        scheduled:
          type: integer
          format: int64
          description: Jobs waiting for their scheduled time.
      description: Number of jobs per lifecycle state; a zero field means no job was
        observed in that state.
    JobQueue:
      type: object
      required:
        - name
        - paused
        - available
        - running
        - retryable
        - scheduled
      properties:
        name:
          type: string
          description: Queue name; River only tracks queues that have held at least one job.
        paused:
          type: boolean
          description: Whether the queue is paused and therefore hands out no new jobs.
        available:
          type: integer
          format: int64
          description: Jobs ready to run in this queue.
        running:
          type: integer
          format: int64
          description: Jobs of this queue currently being worked.
        retryable:
          type: integer
          format: int64
          description: Failed jobs of this queue waiting for another attempt; the
            administrator listing leaves it 0.
        scheduled:
          type: integer
          format: int64
          description: Jobs of this queue waiting for their scheduled time; the
            administrator listing leaves it 0.
      description: One River queue with the counters the job dashboard shows.
    JobQueueList:
      type: object
      required:
        - queues
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/JobQueue"
          description: Every known queue for an administrator, otherwise only the queues
            holding the caller's jobs.
      description: Queues visible to the caller.
    JobPurgeResult:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64
          description: Number of job rows deleted.
      description: Outcome of a job purge.
    PeriodicJob:
      type: object
      required:
        - id
        - kind
        - args
        - queue
        - priority
        - maxAttempts
        - tags
        - cronExpression
        - cronTimezone
        - nextRunAt
        - paused
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Durable identifier; update, pause, resume and delete refer to it.
        kind:
          type: string
          description: Worker kind each run uses.
        args:
          type: object
          additionalProperties: {}
          description: Arguments inserted with every run, keyed by JSON field name.
        queue:
          type: string
          description: Queue the runs are inserted into.
        priority:
          type: integer
          format: int32
          description: River priority of the runs, 1 being the highest.
        maxAttempts:
          type: integer
          format: int32
          description: Attempt budget of each run.
        tags:
          type: array
          items:
            type: string
          description: Labels attached to each run.
        cronExpression:
          type: string
          description: Cron expression, or River's "
        cronTimezone:
          type: string
          description: IANA timezone the expression is evaluated in; never blank.
        nextRunAt:
          type: string
          format: date-time
          description: Time the next run is due.
        paused:
          type: boolean
          description: Whether the schedule is suspended.
        pausedAt:
          type: string
          format: date-time
          description: Time the schedule was paused; absent while it is active.
        createdAt:
          type: string
          format: date-time
          description: Time the definition was first stored.
        updatedAt:
          type: string
          format: date-time
          description: Time the definition was last changed.
      description: A stored periodic job definition with its runtime bookkeeping.
    PeriodicJobList:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PeriodicJob"
          description: Definitions known to the instance, at most 1000.
      description: The stored periodic job definitions.
    PeriodicJobCreate:
      type: object
      required:
        - id
        - kind
        - args
        - queue
        - priority
        - maxAttempts
        - tags
        - cronExpression
        - cronTimezone
      properties:
        id:
          type: string
          description: Identifier to create; it must not be in use yet.
        kind:
          type: string
          description: Worker kind each run uses; the same cleanup sweep kinds JobCreate
            accepts.
        args:
          type: object
          additionalProperties: {}
          description: Arguments inserted with every run, keyed by JSON field name.
        queue:
          type: string
          description: Queue the runs are inserted into; blank selects River's default
            queue.
        priority:
          type: integer
          format: int32
          description: River priority of the runs, 1 being the highest; 0 or less selects
            the default.
        maxAttempts:
          type: integer
          format: int32
          description: Attempt budget of each run; 0 or less selects the default.
        tags:
          type: array
          items:
            type: string
          description: Labels attached to each run.
        cronExpression:
          type: string
          description: Cron expression, or River's "
        cronTimezone:
          type: string
          description: IANA timezone the expression is evaluated in; blank is stored as UTC.
        paused:
          type: boolean
          description: Store the schedule paused instead of active; absent stores it active.
      description: A periodic job definition to store.
    PeriodicJobTemplate:
      type: object
      required:
        - kind
        - label
        - description
        - defaultId
        - defaultArgs
        - defaultQueue
        - recommendedCron
      properties:
        kind:
          type: string
          description: Worker kind the schedule inserts.
        label:
          type: string
          description: Name shown in the console.
        description:
          type: string
          description: What the schedule does.
        defaultId:
          type: string
          description: Identifier the periodic job is created with.
        defaultArgs:
          type: object
          additionalProperties: {}
          description: Arguments the schedule is created with.
        defaultQueue:
          type: string
          description: Queue the runs are inserted into.
        recommendedCron:
          type: string
          description: Recommended schedule, a cron expression or "
      description: A built-in periodic job offered by the catalog, with the defaults a
        client prefills.
    PeriodicJobCatalog:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/PeriodicJobTemplate"
          description: One template per enabled feature; a schedule whose worker is
            unavailable is absent.
      description: The built-in schedules this deployment is able to run.
    PeriodicJobUpdate:
      type: object
      required:
        - kind
        - args
        - queue
        - priority
        - maxAttempts
        - tags
        - cronExpression
        - cronTimezone
      properties:
        kind:
          type: string
          description: Worker kind each run uses; the same cleanup sweep kinds JobCreate
            accepts.
        args:
          type: object
          additionalProperties: {}
          description: Arguments inserted with every run, keyed by JSON field name.
        queue:
          type: string
          description: Queue the runs are inserted into; blank selects River's default
            queue.
        priority:
          type: integer
          format: int32
          description: River priority of the runs, 1 being the highest; 0 or less selects
            the default.
        maxAttempts:
          type: integer
          format: int32
          description: Attempt budget of each run; 0 or less selects the default.
        tags:
          type: array
          items:
            type: string
          description: Labels attached to each run.
        cronExpression:
          type: string
          description: Cron expression, or River's "
        cronTimezone:
          type: string
          description: IANA timezone the expression is evaluated in; blank is stored as UTC.
        paused:
          type: boolean
          description: Leave the schedule paused instead of active; absent resumes a
            paused schedule.
      description: >-
        Replacement state of a periodic job. Every field is taken from the body,
        so

        leaving paused unset resumes a paused schedule, and a blank queue, a

        non-positive priority or maxAttempts, or a blank cronTimezone selects
        the

        default instead of keeping the stored value.
    StorageSummary:
      type: object
      required:
        - logicalBytes
        - activeFiles
        - activeFolders
        - trashedFiles
        - trashBytes
      properties:
        logicalBytes:
          type: integer
          format: int64
          description: Summed size of the active files, in bytes.
        activeFiles:
          type: integer
          format: int64
          description: Number of active file entries.
        activeFolders:
          type: integer
          format: int64
          description: Number of active folder entries.
        trashedFiles:
          type: integer
          format: int64
          description: Number of trashed file entries; trashed folders are not counted.
        trashBytes:
          type: integer
          format: int64
          description: Summed size of those trashed files, in bytes.
      description: Current totals of one drive.
    StorageGrowthPoint:
      type: object
      required:
        - day
        - addedBytes
        - logicalBytes
      properties:
        day:
          type: string
          format: date
          description: Calendar day the point covers, in UTC.
        addedBytes:
          type: integer
          format: int64
          description: Size of the files created that day and still active, in bytes.
        logicalBytes:
          type: integer
          format: int64
          description: Cumulative size of all active files up to and including that day,
            in bytes.
      description: One day of the thirty-day growth series.
    StorageChannelStatistic:
      type: object
      required:
        - channelId
        - name
        - selected
        - health
        - partCount
        - storedBytes
      properties:
        channelId:
          type: integer
          format: int64
          description: Telegram channel ID.
        name:
          type: string
          description: Channel title.
        selected:
          type: boolean
          description: True for the channel new uploads currently target; at most one
            channel per account.
        health:
          type: string
          description: >-
            Last recorded health as a plain string: `unknown`, `healthy`,
            `degraded` or

            `unavailable`.
        lastCheckedAt:
          type: string
          format: date-time
          description: When the health was last recorded; omitted when the channel was
            never checked.
        partCount:
          type: integer
          format: int64
          description: Number of stored parts of the account's active files on this channel.
        storedBytes:
          type: integer
          format: int64
          description: >-
            Summed stored size of those parts, in bytes: the on-Telegram figure,
            not the

            plaintext size.
      description: One Telegram channel of the account and how much of the drive it holds.
    StorageCleanupStatistics:
      type: object
      required:
        - trashBytes
        - staleUploadBytes
        - staleUploads
        - totalReclaimableBytes
      properties:
        trashBytes:
          type: integer
          format: int64
          description: Stored size of the parts of trashed files, in bytes.
        staleUploadBytes:
          type: integer
          format: int64
          description: Stored size of the parts left behind by expired upload sessions, in
            bytes.
        staleUploads:
          type: integer
          format: int64
          description: Number of expired upload sessions, whether or not they still hold
            stored parts.
        totalReclaimableBytes:
          type: integer
          format: int64
          description: "`trashBytes` plus `staleUploadBytes`, in bytes."
      description: Space that emptying the trash and dropping stale upload parts would
        reclaim.
    StorageActivity:
      type: object
      required:
        - id
        - type
        - resourceType
        - label
        - occurredAt
      properties:
        id:
          type: integer
          format: int64
          description: Event row ID; the feed is ordered by it, newest first.
        type:
          type: string
          description: Event type, for example `file.created` or `share.deleted`.
        resourceType:
          type: string
          description: Kind of resource the event is about, for example `file` or `channel`.
        resourceId:
          type: string
          description: Identifier of that resource; omitted when the event names no single
            resource.
        label:
          type: string
          description: Human-readable name taken from the event payload, falling back to
            the event type.
        occurredAt:
          type: string
          format: date-time
          description: When the event happened, in UTC.
      description: One entry of the recent-activity feed.
    StorageDashboard:
      type: object
      required:
        - summary
        - growth
        - categories
        - channels
        - cleanup
        - activity
      properties:
        summary:
          allOf:
            - $ref: "#/components/schemas/StorageSummary"
          description: Current byte and entry totals.
        growth:
          type: array
          items:
            $ref: "#/components/schemas/StorageGrowthPoint"
          description: One point per day for the last thirty days, oldest first.
        categories:
          type: array
          items:
            $ref: "#/components/schemas/FileCategoryStatistics"
          description: Active files broken down by category bucket.
        channels:
          type: array
          items:
            $ref: "#/components/schemas/StorageChannelStatistic"
          description: Every channel of the account with the bytes it stores.
        cleanup:
          allOf:
            - $ref: "#/components/schemas/StorageCleanupStatistics"
          description: Reclaimable space estimates.
        activity:
          type: array
          items:
            $ref: "#/components/schemas/StorageActivity"
          description: >-
            Up to eight recent events, newest first, limited to file, upload,
            share and channel

            events.
      description: Aggregated storage view of one account.
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: teldrive_access
      description: Auth scheme for the HttpOnly session cookie set by the
        `/v1/auth/cookie/*` endpoints.
    BearerAuth:
      type: http
      scheme: Bearer
    ExternalApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Auth scheme for long-lived API keys, sent in the `X-Api-Key` header.
    EventTicketAuth:
      type: apiKey
      in: query
      name: ticket
      description: >-
        Auth scheme for the short-lived `ticket` query parameter that browser
        EventSource

        clients use.
servers:
  - url: /api
    description: Current TelDrive server
    variables: {}
