        - name: fileName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A complete file body with its caching and disposition metadata.
          headers:
            Content-Length:
              required: true
              description: Length of the delivered body in bytes.
              schema:
                type: integer
                format: int64
            Accept-Ranges:
              required: true
              description: The server always accepts byte ranges.
              schema:
                type: string
                enum:
                  - bytes
            Etag:
              required: true
              description: Strong ETag of the content hash, or of the generation when no hash
                is recorded.
              schema:
                $ref: "#/components/schemas/ETag"
            Last-Modified:
              required: true
              description: Modification time of the content, sent as an HTTP date.
              schema:
                type: string
                format: http-date
            Content-Disposition:
              required: true
              description: '"inline" or "attachment" plus the RFC 2231 encoded file name.'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              x-ogen-raw-response: true
        "206":
