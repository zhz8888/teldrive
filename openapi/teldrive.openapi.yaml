openapi: 3.0.0
info:
  title: TelDrive API
  version: 1.0.0
  summary: Telegram-backed cloud drive API
  description: >-
    Backend-first API for rclone and other TelDrive clients. Upload sessions are

    durable, API instances are stateless, and completed files are immediately
    readable.
tags:
  - name: System
  - name: Authentication
  - name: Account
  - name: Users
  - name: Administration
  - name: API keys
  - name: Sessions
  - name: Channels
  - name: Bots
  - name: Events
  - name: Files
  - name: Folders
  - name: Uploads
  - name: Shares
  - name: Public shares
  - name: Jobs
  - name: Periodic Jobs
  - name: Storage
paths:
  /health/live:
    get:
      operationId: healthLive
      description: Process liveness check.
      parameters: []
      responses:
        "200":
          description: Declared success response carrying a JSON body of type `Body`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      tags:
        - System
      security:
        - {}
  /health/ready:
    get:
      operationId: healthReady
      description: Readiness check for PostgreSQL, migrations, and required runtime state.
      parameters: []
      responses:
        "200":
          description: Declared success response carrying a JSON body of type `Body`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - System
      security:
        - {}
