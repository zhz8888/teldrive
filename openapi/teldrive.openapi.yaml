        - CookieAuth: []
        - ExternalApiKeyAuth: []
    delete:
      operationId: deleteJob
      description: >-
        Remove a job permanently; an active job is cancelled instead, because
        River

        refuses to delete a job a worker may still hold. Non-administrators can
        only

        delete their own jobs, and an unknown ID is reported as 404.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
