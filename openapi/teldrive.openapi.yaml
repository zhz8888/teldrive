      security:
        - {}
  /v1/auth/cookie/telegram/verify-password:
    post:
      operationId: cookieTelegramLoginVerifyPassword
      description: Complete Telegram password verification and establish an HttpOnly
        cookie session.
      parameters: []
      responses:
        "200":
          description: "Cookie login response: sets both session cookies and returns the
            new session state."
          headers:
            Set-Cookie:
              required: true
              description: "`Set-Cookie` values for the access and refresh cookies; all of
                them must be stored."
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
