      description: Stream complete or partial file content. The filename path segment
        gives command-line clients a useful output name.
      parameters:
        - $ref: "#/components/parameters/FileContentRequestOptions.range"
        - $ref: "#/components/parameters/FileContentRequestOptions.ifNoneMatch"
        - $ref: "#/components/parameters/FileContentRequestOptions.download"
        - name: fileId
          in: path
