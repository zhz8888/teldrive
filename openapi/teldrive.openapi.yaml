  /v1/auth/cookie/telegram/verify-code:
    post:
      operationId: cookieTelegramLoginVerifyCode
      description: Complete Telegram code verification and establish an HttpOnly
        cookie session.
      parameters: []
      responses:
        "200":
          description: "Cookie login response: sets both session cookies and returns the
            new session state."
          headers:
            Set-Cookie:
              required: true
              description: "`Set-Cookie` values for the access and refresh cookies; all of
                them must be stored."
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieSession"
        "202":
          description: Declared success response carrying a JSON body of type `Body`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLoginStartResponse"
        "400":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
