      operationId: purgeJobs
      description: >-
        Permanently delete the caller's jobs in one finalized state and report
        how

        many rows were removed; administrators purge across all users. Only

        cancelled, completed and discarded are accepted, and any other state is

        rejected with 409, so a job that may still run cannot be deleted here.
      parameters:
        - $ref: "#/components/parameters/JobPurgeQuery"
      responses:
        "200":
          description: Declared success response carrying a JSON body of type `Body`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPurgeResult"
        "401":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Jobs
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      description: >-
        Return one job by its decimal ID. Non-administrators only reach their
        own

        jobs, so an unknown or foreign ID is reported as 404 without disclosing
        which

        IDs exist.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Declared success response carrying a JSON body of type `Body`.
