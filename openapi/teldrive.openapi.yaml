            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramQRLoginPollRequest"
      security:
        - {}
  /v1/auth/cookie/refresh:
    post:
      operationId: refreshCookieSession
      description: Rotate session cookies using the HttpOnly refresh cookie.
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          description: "Cookie login response: sets both session cookies and returns the
            new session state."
          headers:
            Set-Cookie:
              required: true
              description: "`Set-Cookie` values for the access and refresh cookies; all of
                them must be stored."
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieSession"
        "401":
          description: >-
