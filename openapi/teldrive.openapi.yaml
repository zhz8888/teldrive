            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      security:
        - {}
  /v1/auth/cookie/logout:
    post:
      operationId: logoutCookieSession
      description: Revoke the cookie session and clear its HttpOnly cookies.
      parameters: []
      responses:
        "204":
          description: "Cookie logout response: clears both session cookies and carries no
            body."
          headers:
            Set-Cookie:
              required: true
              description: Already expired `Set-Cookie` values that delete both session
                cookies.
              schema:
                type: array
                items:
                  type: string
        "401":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      security:
        - CookieAuth: []
  /v1/me:
    get:
      operationId: getCurrentUser
      description: Return the authenticated user profile.
      parameters: []
      responses:
        "200":
          description: Declared success response carrying a JSON body of type `Body`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Account
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/me/photo:
    get:
      operationId: getProfilePhoto
      description: Return the authenticated Telegram user's small profile photo.
      parameters: []
      responses:
        "200":
          description: Small Telegram profile photo of the authenticated account.
          headers:
            Content-Length:
              required: true
              description: Photo size in bytes.
              schema:
                type: integer
                format: int64
            Cache-Control:
              required: true
              description: Cache directive the server sends; the photo may be cached privately
                for a day.
              schema:
                type: string
            Etag:
              required: true
              description: Version of the photo, derived from the Telegram photo ID.
              schema:
                $ref: "#/components/schemas/ETag"
            Content-Disposition:
              required: true
              description: Always `inline; filename="profile.jpeg"`.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "204":
          description: Declared success response with the given status and no body.
        "401":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Account
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/auth/logout:
    post:
      operationId: logoutSession
      description: Revoke the current session.
      parameters: []
      responses:
        "204":
          description: Declared success response with the given status and no body.
        "401":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Account
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/users/search:
    get:
      operationId: searchUsers
      description: >-
        Find other accounts by display name, username or exact user ID so a
        share owner can

        pick a grantee; at most twenty matches are returned.
      parameters:
        - name: search
          in: query
          required: true
          description: Text matched against display name and username, or an exact user ID.
          schema:
            type: string
            minLength: 1
            maxLength: 128
          explode: false
      responses:
        "200":
          description: Declared success response carrying a JSON body of type `Body`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchResult"
        "401":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Users
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/admin/users:
    get:
      operationId: listAdminUsers
      description: >-
        List accounts for the admin console, oldest first. The response is a
        plain

        array capped at five hundred rows with no cursor, so an installation
        with more

        accounts than that has to narrow the list with `search`; every listed
        account

        is returned, and the order is stable.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          explode: false
      responses:
        "200":
          description: Declared success response carrying a JSON body of type `Body`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserSummary"
        "401":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
