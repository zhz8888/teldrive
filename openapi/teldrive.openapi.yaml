  /v1/auth/cookie/telegram/qr/poll:
    post:
      operationId: cookieTelegramQRLoginPoll
      description: Poll Telegram QR login and establish an HttpOnly cookie session
        when authorized.
      parameters: []
      responses:
        "200":
          description: "Cookie login response: sets both session cookies and returns the
            new session state."
          headers:
            Set-Cookie:
              required: true
              description: "`Set-Cookie` values for the access and refresh cookies; all of
                them must be stored."
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieSession"
        "202":
          description: Declared success response carrying a JSON body of type `Body`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramQRLoginResponse"
        "400":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: >-
            Declared error response: `statusCode` selects the status, `body`
            carries the error

            envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
